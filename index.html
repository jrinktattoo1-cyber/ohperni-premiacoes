
<!DOCTYPE html>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: Arial, sans-serif;
}

main {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
}

/* IMAGEM ORIGINAL */

.banner {
  position: relative;
  width: 100%;
}

.arte {
  display: block;
  width: 100%;
  height: auto;
}

/* BOTÃO INVISÍVEL SOBRE A ARTE */

.botao {
  position: absolute;
  left: 3%;
  top: 65%;
  width: 94%;
  height: 13%;
  display: block;
  z-index: 20;
  cursor: pointer;
  background: transparent;
  border: none;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

/* CONTATOS */

.contatos {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 20px 12px 35px;
}

.contatos a {
  background: #171717;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 14px;
  color: white;
  font-weight: bold;
  text-decoration: none;
}

/* CONFIRMAÇÃO DE IDADE */

.maioridade {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.96);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.caixa {
  width: 100%;
  max-width: 390px;
  background: #171717;
  border: 2px solid #d5a539;
  border-radius: 20px;
  padding: 30px 22px;
  text-align: center;
}

.coroa {
  font-size: 48px;
}

.caixa h2 {
  color: #f3cc65;
}

.caixa p {
  line-height: 1.5;
}

.acoes {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.acoes button {
  flex: 1;
  padding: 15px 8px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.sim {
  background: #149f48;
  color: white;
}

.nao {
  background: #444;
  color: white;
}

.bloqueado {
  display: none;
  color: #ff8989;
  font-weight: bold;
}

</style>
</head>

<body>

<main>

<div class="banner">

<img
  class="arte"
  src="02F3256A-1D98-42FD-817D-0D2841408C94.png"
  alt="Oh Perni Premiações"
>

<a
  class="botao"
  href="#contatos"
  aria-label="Informações da campanha"
></a>

</div>

<div class="contatos" id="contatos">

<a
  href="https://www.instagram.com/_juniorink/"
  target="_blank"
  rel="noopener noreferrer"
>
Instagram
</a>

<a
  href="https://wa.me/5511986220490?text=Ol%C3%A1%21%20Vim%20pelo%20site%20Oh%20Perni%20Premia%C3%A7%C3%B5es%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es."
  target="_blank"
  rel="noopener noreferrer"
>
WhatsApp
</a>

</div>

</main>

<!-- VERIFICAÇÃO DE IDADE -->

<div class="maioridade" id="maioridade">

<div class="caixa">

<div class="coroa">👑</div>

<h2>OH PERNI PREMIAÇÕES</h2>

<p>Antes de continuar, confirme sua idade.</p>

<h3>Você tem 18 anos ou mais?</h3>

<div class="acoes" id="acoes">

<button class="sim" onclick="confirmarIdade()">
SIM, TENHO 18+
</button>

<button class="nao" onclick="negarIdade()">
NÃO
</button>

</div>

<p class="bloqueado" id="bloqueado">
Acesso permitido somente para maiores de 18 anos.
</p>

</div>

</div>

<script>

const aviso = document.getElementById("maioridade");

try {
  if (localStorage.getItem("ohperni_18") === "sim") {
    aviso.style.display = "none";
  }
} catch (e) {
  // Mantém a confirmação visível.
}

function confirmarIdade() {
  try {
    localStorage.setItem("ohperni_18", "sim");
  } catch (e) {
    // Permite continuar nesta visita.
  }

  aviso.style.display = "none";
}

function negarIdade() {
  document.getElementById("acoes").style.display = "none";
  document.getElementById("bloqueado").style.display = "block";
}

</script>

</body>
</html>
