
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Oh Perni Premiações | R$ 1.000 no Pix</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}
main{
  max-width:650px;
  margin:auto;
  position:relative;
}
.arte{
  width:100%;
  display:block;
}
.botao{
  position:absolute;
  left:3%;
  top:67%;
  width:94%;
  height:10%;
  background:transparent;
  border:0;
  cursor:pointer;
}
.contatos{
  display:flex;
  gap:12px;
  justify-content:center;
  padding:20px 12px 35px;
}
.contatos a{
  color:white;
  text-decoration:none;
  background:#171717;
  border:1px solid #444;
  border-radius:12px;
  padding:14px;
  font-weight:bold;
}
.aviso{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}
.caixa{
  background:#171717;
  border:1px solid #d5a539;
  padding:25px;
  border-radius:18px;
  text-align:center;
  max-width:380px;
}
.caixa button{
  padding:12px 35px;
  border:0;
  border-radius:10px;
  background:#e6c36b;
  font-weight:bold;
}
</style>
</head>
<body>
<main>
<img class="arte" src="ohperni_arte.jpg" alt="Oh Perni Premiações - R$ 1.000 no Pix">

<button class="botao" aria-label="Participar da campanha" onclick="participar()"></button>

<div class="contatos">
<a href="https://www.instagram.com/_juniorink/" target="_blank">Instagram</a>
<a href="https://wa.me/5511986220490" target="_blank">WhatsApp</a>
</div>
</main>

<div class="aviso" id="aviso">
<div class="caixa">
<h2>R$ 1.000 no Pix</h2>
<p>Nossa primeira campanha está sendo preparada. Em breve você poderá participar!</p>
<button onclick="document.getElementById('aviso').style.display='none'">Fechar</button>
</div>
</div>

<script>
const LINK_RIFA = "";

function participar(){
 if(LINK_RIFA){
   window.location.href = LINK_RIFA;
 }else{
   document.getElementById("aviso").style.display="flex";
 }
}
</script>
</body>
</html>
